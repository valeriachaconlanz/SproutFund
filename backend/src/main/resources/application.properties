server.port=8080
spring.application.name=sproutfund-backend

# Supabase Postgres — direct connection (recommended for a persistent
# JPA/HikariCP-backed server, as opposed to the Supavisor transaction
# pooler which is meant for serverless/short-lived connections).
# Host/port/password come from Project Settings > Database > Connection string.
spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USER:postgres}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
# validate (not create/update) because supabase/schema.sql is the source of
# truth for the schema — Hibernate only checks entities match it at startup.
spring.jpa.hibernate.ddl-auto=validate

# Verifies Supabase-issued access tokens locally using the project's public
# signing keys (Project Settings > API > JWT Keys). Requires the project to
# be on Supabase's asymmetric signing keys, not the legacy shared secret —
# migrate via "Migrate JWT secret" in the dashboard if needed.
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://${SUPABASE_PROJECT_REF}.supabase.co/auth/v1/.well-known/jwks.json

# Claude (Anthropic) API — set ANTHROPIC_API_KEY as an environment variable,
# or set anthropic.api-key=<your-key> in a local application.properties (do not commit keys).
anthropic.api-key=${ANTHROPIC_API_KEY:}
